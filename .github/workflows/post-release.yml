name: Post Release

on:
  release:
    types:
      - published

jobs:
  post_release:
    name: Post Release
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: apexskier/github-release-commenter@v1.4.1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          comment-template: |
            :tada: This is included in version {release_link} :tada:

            The release is available on:

            * [GitHub releases](https://github.com/all-contributors/contribution-types/releases/tag/{release_tag})
            * [npm package (@latest dist-tag)](https://www.npmjs.com/package/all-contributors-types/v/${{ env.npm_version }})

            Cheers! 📦🚀
